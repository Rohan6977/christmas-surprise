<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Christmas Surprise 🎄</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: linear-gradient(#0b1d3a, #000);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: white;
        touch-action: manipulation;
    }

    canvas {
        position: fixed;
        top: 0;
        left: 0;
    }

    .message {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        width: 90%;
        max-width: 360px;
        animation: glow 2s infinite alternate;
        pointer-events: none;
    }

    h1 {
        font-size: clamp(2rem, 6vw, 2.6rem);
        margin: 0;
    }

    p {
        font-size: clamp(1.1rem, 4vw, 1.3rem);
        margin-top: 10px;
        opacity: 0.9;
    }

    .heart {
        font-size: 3rem;
        margin-top: 10px;
        animation: pulse 1.5s infinite;
    }

    .secret {
        opacity: 0;
        margin-top: 18px;
        font-size: clamp(1.2rem, 4.5vw, 1.5rem);
        color: #ffb3c6;
        transition: opacity 1.8s ease;
    }

    .secret.show {
        opacity: 1;
    }

    .hint {
        position: fixed;
        bottom: 20px;
        width: 100%;
        text-align: center;
        font-size: 0.95rem;
        opacity: 0.7;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #fff; }
        to { text-shadow: 0 0 25px #ff4d6d; }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.25); }
        100% { transform: scale(1); }
    }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="message">
    <h1>Merry Christmas 🎄</h1>
    <p>Tap anywhere ✨</p>
    <div class="heart">❤️</div>
    <div class="secret" id="secretText">
        You are my favorite gift 🎁
    </div>
</div>

<div class="hint">✨ tap the screen ✨</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// ❄️ Snow
const snowflakes = Array.from({ length: 90 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 3 + 1,
    s: Math.random() + 0.5
}));

// 🎆 Fireworks
let particles = [];

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Snow
    ctx.fillStyle = "white";
    snowflakes.forEach(f => {
        ctx.beginPath();
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
        ctx.fill();
        f.y += f.s;
        if (f.y > canvas.height) {
            f.y = -5;
            f.x = Math.random() * canvas.width;
        }
    });

    // Fireworks
    particles.forEach((p, i) => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    });

    requestAnimationFrame(animate);
}
animate();

// 📱 Touch / Click Surprise
function surprise(x, y) {
    document.getElementById("secretText").classList.add("show");

    for (let i = 0; i < 30; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            size: Math.random() * 3 + 1.5,
            life: 50,
            color: `hsl(${Math.random() * 360}, 100%, 70%)`
        });
    }
}

document.body.addEventListener("touchstart", e => {
    const t = e.touches[0];
    surprise(t.clientX, t.clientY);
}, { passive: true });

document.body.addEventListener("click", e => {
    surprise(e.clientX, e.clientY);
});
</script>

</body>
</html>
